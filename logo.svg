<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" role="img" aria-label="Z-Plot Industries">
  <!-- Card background -->
  <rect x="1" y="1" width="46" height="46" rx="9" fill="#12141A" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <!-- Subtle 3x3 grid lines -->
  <g stroke="rgba(255,255,255,0.07)" stroke-width="1">
    <line x1="9"  y1="17" x2="39" y2="17"/>
    <line x1="9"  y1="24" x2="39" y2="24"/>
    <line x1="9"  y1="31" x2="39" y2="31"/>
    <line x1="17" y1="9"  x2="17" y2="39"/>
    <line x1="24" y1="9"  x2="24" y2="39"/>
    <line x1="31" y1="9"  x2="31" y2="39"/>
  </g>
  <!-- Z path: top, diagonal, bottom — dotted (round linecap + 0-dash = circles) -->
  <line x1="12" y1="12" x2="36" y2="12" stroke="#6366F1" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="0 5.5"/>
  <line x1="36" y1="12" x2="12" y2="36" stroke="#6366F1" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="0 5.5"/>
  <line x1="12" y1="36" x2="36" y2="36" stroke="#6366F1" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="0 5.5"/>
  <!-- Corner nodes (larger anchor dots at each Z vertex) -->
  <circle cx="12" cy="12" r="3" fill="#6366F1"/>
  <circle cx="36" cy="12" r="3" fill="#6366F1"/>
  <circle cx="12" cy="36" r="3" fill="#6366F1"/>
  <circle cx="36" cy="36" r="3" fill="#6366F1"/>
</svg>
